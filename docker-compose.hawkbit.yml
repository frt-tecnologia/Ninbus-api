# docker-compose.hawkbit.yml
# Production-ready hawkBit setup with PostgreSQL + filesystem artifact storage
#
# Usage: docker compose -f docker-compose.hawkbit.yml up -d
#
# Architecture:
# ┌────────────────┐    ┌────────────────┐    ┌──────────┐
# │ Ninbus API     │───>│ hawkBit        │───>│ PostgreSQL│
# │ (port 8081)    │    │ (port 8080)    │    │ (5432)   │
# └────────────────┘    └────────────────┘    └──────────┘
#                              │
#                       ┌──────┴──────┐
#                       │ artifactrepo │  ← firmware files on disk
#                       │ (Docker vol) │
#                       └─────────────┘
#
# hawkBit storage model:
# - Metadata (targets, DS, SM, actions) → PostgreSQL
# - Binary artifacts (firmware files)   → Local filesystem (/app/artifactrepo)
# - NOT S3 — hawkBit uses filesystem by default (hawkbit-artifact-fs)
# - S3/Azure Blob is optional via hawkbit-artifact-cloud
#
# For production, add:
# - Reverse proxy (Traefik/Nginx) with TLS
# - PostgreSQL backups
# - Artifact volume backups

services:
  hawkbit-db:
    image: postgres:16-alpine
    container_name: hawkbit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hawkbit
      POSTGRES_USER: hawkbit
      POSTGRES_PASSWORD: hawkbit123
    volumes:
      - hawkbit-pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Expose on 5433 to avoid conflict with Ninbus DB

  hawkbit:
    image: hawkbit/hawkbit-update-server:latest
    container_name: hawkbit
    restart: unless-stopped
    depends_on:
      - hawkbit-db
    ports:
      - "8080:8080"
    environment:
      # Switch from H2 (in-memory) to PostgreSQL
      PROFILES: postgresql
      SPRING_DATASOURCE_URL: jdbc:postgresql://hawkbit-db:5432/hawkbit
      SPRING_DATASOURCE_USERNAME: hawkbit
      SPRING_DATASOURCE_PASSWORD: hawkbit123
      # Java memory (adjust for your workload)
      X_MS: 768m
      X_MX: 768m
    volumes:
      # Artifact binary storage — PERSIST THIS!
      # Without this volume, uploaded firmware files are lost on container restart
      - hawkbit-artifacts:/app/artifactrepo

volumes:
  hawkbit-pgdata:
  hawkbit-artifacts:
