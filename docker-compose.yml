services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ninbus-api
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    environment:
      # Aplicação
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8081}
      
      # Banco de Dados
      DATABASE_URL: ${DATABASE_URL}
      
      # Autenticação
      ENABLE_AUTH: ${ENABLE_AUTH:-true}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8081}
      
      # Email (Resend)
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      
      # Configurações Gerais
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_RATE_LIMITER: ${ENABLE_RATE_LIMITER:-true}
      
      # Mender Gateway
      MENDER_ENABLED: ${MENDER_ENABLED:-false}
      MENDER_GATEWAY_URL: ${MENDER_GATEWAY_URL}
      MENDER_PAT: ${MENDER_PAT}
      MENDER_TIMEOUT_MS: ${MENDER_TIMEOUT_MS:-30000}
      MENDER_HOST_OVERRIDE: ${MENDER_HOST_OVERRIDE}
      MENDER_SKIP_TLS: ${MENDER_SKIP_TLS:-false}
      MENDER_TENANT_TOKEN: ${MENDER_TENANT_TOKEN}