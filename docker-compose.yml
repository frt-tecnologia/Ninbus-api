# ═══════════════════════════════════════════════════════════════════════
# Ninbus API — Docker Compose (Production)
#
# Architecture:
#
#   Internet → [Ninbus API :8081] → [hawkBit :8080]
#                    │                      │
#                    │                      ├── Neon PostgreSQL (cloud)
#                    │                      └── AWS S3 / Cloudflare R2 (artifact storage)
#                    │
#                    └── Neon PostgreSQL (cloud)
#
# Swap guide (just change env vars in .env):
#   Storage: AWS S3 → Cloudflare R2
#     → change S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY, S3_REGION=auto
#   DB hawkBit: Neon → local PG
#     → change HAWKBIT_DATABASE_URL, HAWKBIT_DB_USER, HAWKBIT_DB_PASS
#   DB Ninbus:  Neon → local PG
#     → change DATABASE_URL
#
# Usage:
#   docker compose up -d                    # all services
#   docker compose up -d api hawkbit        # without S3 pre-signed URLs
#   docker compose logs -f api              # follow logs
#   docker compose build hawkbit            # rebuild custom hawkBit image
# ═══════════════════════════════════════════════════════════════════════

services:
  # ── Ninbus API ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ninbus-api
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8081}

      # Database (Neon cloud — swap to local PG via env)
      DATABASE_URL: ${DATABASE_URL}

      # Authentication
      ENABLE_AUTH: ${ENABLE_AUTH:-true}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8081}

      # Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@ninbus.com}

      # General
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_RATE_LIMITER: ${ENABLE_RATE_LIMITER:-true}

      # Platform admin (comma-separated emails)
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}

      # hawkBit connection
      HAWKBIT_ENABLED: ${HAWKBIT_ENABLED:-true}
      HAWKBIT_URL: ${HAWKBIT_URL:-http://hawkbit:8080}
      HAWKBIT_USERNAME: ${HAWKBIT_USERNAME:-admin}
      HAWKBIT_PASSWORD: ${HAWKBIT_PASSWORD:-admin}
      HAWKBIT_TIMEOUT_MS: ${HAWKBIT_TIMEOUT_MS:-30000}
      HAWKBIT_SKIP_TLS: ${HAWKBIT_SKIP_TLS:-false}
      HAWKBIT_SYNC_MODE: ${HAWKBIT_SYNC_MODE:-hybrid}
      HAWKBIT_SYNC_INTERVAL_SEC: ${HAWKBIT_SYNC_INTERVAL_SEC:-30}
      HAWKBIT_SYNC_STALE_SEC: ${HAWKBIT_SYNC_STALE_SEC:-60}
      HAWKBIT_SYNC_ACTIVE_WINDOW_SEC: ${HAWKBIT_SYNC_ACTIVE_WINDOW_SEC:-300}
      HAWKBIT_AUTOPROVISIONING: ${HAWKBIT_AUTOPROVISIONING:-false}

      # SSE (Server-Sent Events)
      SSE_ENABLED: ${SSE_ENABLED:-true}
      SSE_HEARTBEAT_SEC: ${SSE_HEARTBEAT_SEC:-30}
      SSE_MAX_CONNECTIONS_PER_COMPANY: ${SSE_MAX_CONNECTIONS_PER_COMPANY:-50}


    depends_on:
      hawkbit:
        condition: service_healthy
    # ── Resource limits & security ──
    mem_limit: ${API_MEM_LIMIT:-256m}
    cpus: ${API_CPUS:-0.5}
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m

  # ── Eclipse hawkBit Update Server (custom build with S3) ────────────
  # Built from: docker/hawkbit/Dockerfile
  # Source: docker/hawkbit/s3-extension/
  #
  # Artifact storage: AWS S3 / Cloudflare R2 (private bucket).
  # CDN download (CloudFront or R2) configured via HAWKBIT_CDN_* vars.
  # When S3 is disabled, uses local filesystem (Docker volume).
  hawkbit:
    build:
      context: .
      dockerfile: docker/hawkbit/Dockerfile
    container_name: hawkbit
    restart: unless-stopped
    ports:
      - "${HAWKBIT_PORT:-8080}:8080"
    environment:
      # ── Database: Neon PostgreSQL ──
      PROFILES: postgresql
      SPRING_DATASOURCE_URL: ${HAWKBIT_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${HAWKBIT_DB_USER:-neondb_owner}
      SPRING_DATASOURCE_PASSWORD: ${HAWKBIT_DB_PASS}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE: POSTGRESQL

      # ── hawkBit Admin ──
      HAWKBIT_SECURITY_USER_ADMIN_PASSWORD: ${HAWKBIT_ADMIN_PASSWORD:-{noop}admin}
      HAWKBIT_SECURITY_USER_ADMIN_ROLES: TENANT_ADMIN

      # ── DDI Security & Auto-Provisioning ──
      # TargetToken auth: allows devices to authenticate via Authorization: TargetToken <token>
      # Without this, ALL DDI polls return 401 regardless of the securityToken value.
      HAWKBIT_SERVER_DDI_SECURITY_AUTHENTICATION_TARGETTOKEN_ENABLED: ${HAWKBIT_DDI_TARGET_TOKEN_AUTH:-true}

      # Auto-provisioning: auto-creates target on first DDI poll.
      # WARNING: When true, ANY device with any token can auto-provision.
      # Set to false in production — only pre-registered devices should connect.
      # When false, devices MUST be provisioned via POST /api/devices/provision first.
      HAWKBIT_SERVER_DDI_AUTOPROVISIONING_ENABLED: ${HAWKBIT_AUTOPROVISIONING:-false}

      # ── S3 Artifact Storage ──
      # Set HAWKBIT_S3_ENABLED=true to activate (overrides filesystem storage)
      ORG_ECLIPSE_HAWKBIT_ARTIFACT_S3_ENABLED: ${HAWKBIT_S3_ENABLED:-false}
      ORG_ECLIPSE_HAWKBIT_ARTIFACT_S3_ENDPOINT: ${S3_ENDPOINT:-}
      ORG_ECLIPSE_HAWKBIT_ARTIFACT_S3_BUCKET_NAME: ${S3_BUCKET:-ninbus-artifacts}
      ORG_ECLIPSE_HAWKBIT_ARTIFACT_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      ORG_ECLIPSE_HAWKBIT_ARTIFACT_S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      ORG_ECLIPSE_HAWKBIT_ARTIFACT_S3_REGION: ${S3_REGION:-}
      # ── CDN Download (CloudFront or R2) ──
      # When set, DDI artifact download URLs point to CDN instead of hawkBit.
      # Mode A (CloudFront RSA): set HAWKBIT_CDN_KEY_PAIR_ID + HAWKBIT_CDN_PRIVATE_KEY_PATH
      # Mode B (R2 HMAC):        set only HAWKBIT_CDN_BASE_URL (no key-pair-id)
      ORG_ECLIPSE_HAWKBIT_ARTIFACT_S3_CDN_BASE_URL: ${HAWKBIT_CDN_BASE_URL:-}
      ORG_ECLIPSE_HAWKBIT_ARTIFACT_S3_CDN_KEY_PAIR_ID: ${HAWKBIT_CDN_KEY_PAIR_ID:-}
      ORG_ECLIPSE_HAWKBIT_ARTIFACT_S3_CDN_PRIVATE_KEY_PATH: ${HAWKBIT_CDN_PRIVATE_KEY_PATH:-}
      ORG_ECLIPSE_HAWKBIT_ARTIFACT_S3_CDN_EXPIRY_SEC: ${HAWKBIT_CDN_EXPIRY_SEC:-3600}

      # ── Java memory ──
      X_MS: ${HAWKBIT_XMS:-512m}
      X_MX: ${HAWKBIT_XMX:-768m}
      GC: G1
    volumes:
      # CloudFront private key (mount PEM file for Mode A)
      - ./private_key.pem:/run/secrets/cf-private-key.pem:ro
      # Artifact binary storage (fallback when S3 is disabled)
      - hawkbit-artifacts:/app/artifactrepo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://admin:admin@localhost:8080/rest/v1/system/configs"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    # ── Resource limits & security ──
    mem_limit: ${HAWKBIT_MEM_LIMIT:-1g}
    cpus: ${HAWKBIT_CPUS:-1.0}
    pids_limit: 200
    security_opt:
      - no-new-privileges:true

volumes:
  hawkbit-artifacts:
    driver: local