# ═══════════════════════════════════════════════════════════════════════
# Ninbus API — Docker Compose (Production)
#
# Architecture:
#
#   Internet → [Ninbus API :8081] → [hawkBit :8080]
#                    │                      │
#                    │                      ├── Neon PostgreSQL (cloud)
#                    │                      └── SeaweedFS :8333 (artifact binaries)
#                    │
#                    └── Neon PostgreSQL (cloud, same or different DB)
#
# Swap guide:
#   Storage: SeaweedFS → Cloudflare R2   → change S3_ENDPOINT / S3_BUCKET
#   DB:      Neon cloud   → local PG      → change DATABASE_URL
#
# Usage:
#   docker compose up -d                    # all services
#   docker compose up -d api hawkbit        # without SeaweedFS
#   docker compose logs -f api              # follow logs
# ═══════════════════════════════════════════════════════════════════════

services:
  # ── Ninbus API ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ninbus-api
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8081}

      # Database (Neon cloud — swap to local PG via env)
      DATABASE_URL: ${DATABASE_URL}

      # Authentication
      ENABLE_AUTH: ${ENABLE_AUTH:-true}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8081}

      # Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@ninbus.com}

      # General
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_RATE_LIMITER: ${ENABLE_RATE_LIMITER:-true}

      # hawkBit connection
      HAWKBIT_ENABLED: ${HAWKBIT_ENABLED:-true}
      HAWKBIT_URL: ${HAWKBIT_URL:-http://hawkbit:8080}
      HAWKBIT_USERNAME: ${HAWKBIT_USERNAME:-admin}
      HAWKBIT_PASSWORD: ${HAWKBIT_PASSWORD:-admin}
      HAWKBIT_TIMEOUT_MS: ${HAWKBIT_TIMEOUT_MS:-30000}
      HAWKBIT_SKIP_TLS: ${HAWKBIT_SKIP_TLS:-false}
    depends_on:
      hawkbit:
        condition: service_healthy
    mem_limit: ${API_MEM_LIMIT:-256m}
    cpus: ${API_CPUS:-0.5}

  # ── Eclipse hawkBit Update Server ────────────────────────────────────
  # Storage model:
  #   Metadata (targets, DS, SM, actions) → PostgreSQL (Neon cloud)
  #   Binary artifacts (firmware files)   → SeaweedFS (S3-compatible)
  #   NOTE: Standard hawkBit image only supports filesystem storage.
  #   We mount a Docker volume as intermediate step.
  #   For S3/SeaweedFS, a custom build with hawkbit-artifact-cloud is needed.
  hawkbit:
    image: hawkbit/hawkbit-update-server:latest
    container_name: hawkbit
    restart: unless-stopped
    ports:
      - "${HAWKBIT_PORT:-8080}:8080"
    environment:
      # ── Database: Neon PostgreSQL ──
      PROFILES: postgresql
      SPRING_DATASOURCE_URL: ${HAWKBIT_DATABASE_URL:-${DATABASE_URL}}
      SPRING_DATASOURCE_USERNAME: ${HAWKBIT_DB_USER:-neondb_owner}
      SPRING_DATASOURCE_PASSWORD: ${HAWKBIT_DB_PASS:-}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE: POSTGRESQL

      # ── hawkBit Admin ──
      HAWKBIT_SECURITY_USER_ADMIN_PASSWORD: ${HAWKBIT_ADMIN_PASSWORD:-{noop}admin}
      HAWKBIT_SECURITY_USER_ADMIN_ROLES: TENANT_ADMIN

      # ── Java memory ──
      X_MS: ${HAWKBIT_XMS:-512m}
      X_MX: ${HAWKBIT_XMX:-768m}
      GC: G1
    volumes:
      # Artifact binary storage — PERSIST THIS!
      # Future: swap to S3/SeaweedFS with custom hawkBit image
      - hawkbit-artifacts:/app/artifactrepo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/rest/v1/system/configs"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    mem_limit: ${HAWKBIT_MEM_LIMIT:-1g}
    cpus: ${HAWKBIT_CPUS:-1.0}

  # ── SeaweedFS (S3-compatible storage) ────────────────────────────────
  # Currently standalone — not yet integrated with hawkBit (needs custom image).
  # Available for Ninbus API direct use (future: artifact proxy).
  # Swap to Cloudflare R2 by changing environment vars.
  seaweedfs:
    image: chrislusf/seaweedfs:4.17
    container_name: seaweedfs
    restart: unless-stopped
    ports:
      - "${S3_PORT:-8333}:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-secret}
      S3_BUCKET: ${S3_BUCKET:-ninbus-artifacts}
    volumes:
      - seaweedfs-data:/data
    mem_limit: ${S3_MEM_LIMIT:-256m}
    cpus: ${S3_CPUS:-0.25}

volumes:
  hawkbit-artifacts:
    driver: local
  seaweedfs-data:
    driver: local
