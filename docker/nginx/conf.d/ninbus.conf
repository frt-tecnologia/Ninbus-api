# ════════════════════════════════════════════════════════════════════════
# vhost 2 — Dashboard  (ninbus.frt.com.br)  → future :8082
# ════════════════════════════════════════════════════════════════════════
# No dashboard service exists yet. Returns 503 until one is added, so the
# subdomain resolves instead of hitting the default catch-all (API).

server {
	listen 80;
	server_name ninbus.frt.com.br;

	location /.well-known/acme-challenge/ { root /var/www/certbot; }

	# Placeholder — replace with `proxy_pass http://$backend_dash;` (and the
	# matching :443 block) once the admin dashboard ships.
	location / {
		default_type text/plain;
		return 503 "Admin dashboard not deployed yet.\n";
	}
}

# ════════════════════════════════════════════════════════════════════════
# vhost 3 — hawkBit DDI  (hb.ninbus.frt.com.br)  → devices (HTTP)
# ════════════════════════════════════════════════════════════════════════
# Devices talk plain HTTP here. Listens on :80 and :8080 (Opção C: existing
# firmware that already uses :8080 keeps working with ZERO change).
#
# ONLY the DDI path is proxied. The Management API (/rest/v1/*) and the
# hawkBit admin UI (/login, /) are hard-blocked — they are reachable
# internally by the API (http://hawkbit:8080), never publicly.

server {
	listen 80;
	listen 8080;   # Opção C — firmware hardcoded to :8080 keeps working
	server_name hb.ninbus.frt.com.br;

	# ── DDI: the only public surface for devices ─────────────────────
	# Matches /DEFAULT/controller/v1/, /default/controller/v1/, and any
	# tenant segment: /<tenant>/controller/v1/<controllerId>[/...]
	location ~ ^/[^/]+/controller/v1/ {
		set $backend_ddi "hawkbit:8080";
		proxy_pass http://$backend_ddi;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		# forward-headers: hawkBit (SERVER_FORWARD_HEADERS_STRATEGY=framework)
		# uses these to build absolute _links with the PUBLIC host instead of
		# the internal `hawkbit:8080`. Without them, devices can't follow the
		# configData/deploymentBase links and polling breaks.
		proxy_set_header X-Forwarded-Proto $scheme;   # http (device = HTTP)
		proxy_set_header X-Forwarded-Host  $host;     # hb.ninbus.frt.com.br
		proxy_set_header X-Forwarded-Port  $server_port; # 80 | 8080
		proxy_connect_timeout 10s;
		proxy_read_timeout    300s;
		limit_req zone=ddi burst=10 nodelay;
	}

	# ── Explicit denials: hawkBit Management API + admin UI ──────────
	# These must NEVER be public. The API reaches them on the internal
	# Docker network (HAWKBIT_URL=http://hawkbit:8080).
	location        /rest/v1/ { return 404; }
	location =      /login    { return 404; }
	location        /system/  { return 404; }
	location        /         { return 404; }
}
