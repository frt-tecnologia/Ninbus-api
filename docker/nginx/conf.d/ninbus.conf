# ═══════════════════════════════════════════════════════════════════════
# Ninbus — Virtual Hosts (name-based, single public IP)
#
# Architecture:
#
#   DNS (3 A records → same ip-aws, NO port):
#     api.ninbus.frt.com.br  → Ninbus API (Flutter/admin)
#     ninbus.frt.com.br      → Dashboard (future, :8082)
#     hb.ninbus.frt.com.br   → hawkBit DDI (devices, HTTP)
#
#   Internet ──► nginx (only :80 / :443 / :8080 published)
#                  ├─ Host=api.   ─► api:8081      (internal)
#                  ├─ Host=ninbus.─► dashboard:8082(future, 503 now)
#                  └─ Host=hb.    ─► hawkbit:8080  (DDI ONLY; /rest/v1/* = 404)
#
# Reverse-proxy routing is by the Host header (TLS: by SNI). This is how
# three domains share one IP — no extra IPs or instances required.
#
# Internal comms (api → hawkBit Management API) stay on the Docker network
# (HAWKBIT_URL=http://hawkbit:8080) and NEVER go through nginx.
#
# ── Dynamic DNS resolution ──────────────────────────────────────────
# Backends (api, hawkbit) are referenced via `set $backend_*` + `proxy_pass
# http://$backend_*`. Combined with `resolver 127.0.0.11` (nginx.conf) this
# resolves the compose service names at REQUEST time instead of at startup,
# so the proxy does NOT abort when a backend is briefly unavailable and
# survives backend container restarts without needing a reload.
#
# ── Phase status ────────────────────────────────────────────────────
# HTTP-only transitional mode (plan Fases 1–5):
#   • api.   proxies on :80 (plain HTTP) — redirect to HTTPS added in Fase 6
#   • hb.    listens on :80 AND :8080 (Opção C: zero firmware change)
#   • ninbus. returns 503 until the dashboard (:8082) exists
#   • :443 SSL blocks are commented out — enable after issuing the wildcard
#     certificate (*.ninbus.frt.com.br) in Fase 6.
# ═══════════════════════════════════════════════════════════════════════

# Admin firmware upload is multipart → generous body size (API path only;
# the device download path goes to CloudFront, not through nginx).
client_max_body_size 100m;

# Docker embedded DNS — resolves compose service names (api, hawkbit) at
# REQUEST time via `set $backend_*; proxy_pass http://$backend_*`. nginx
# open-source resolves `upstream {}` hostnames once at startup (getaddrinfo),
# which races the Docker DNS at container start and aborts with "host not
# found in upstream". Dynamic resolution decouples proxy start from backend
# readiness and survives backend container restarts without a reload.
resolver 127.0.0.11 valid=30s ipv6=off;

# ════════════════════════════════════════════════════════════════════════
# vhost 1 — API backend  (api.ninbus.frt.com.br)
# ════════════════════════════════════════════════════════════════════════
# Transitional: serves HTTP on :80. In Fase 6 replace this block with the
# :80→:443 redirect below and enable the :443 server block.

server {
	listen 80 default_server;
	server_name api.ninbus.frt.com.br;

	location /.well-known/acme-challenge/ { root /var/www/certbot; }

	# ── Docs (OpenAPI/Scalar) behind Basic Auth ──────────────────────
	# Protects /docs, /docs/json, /docs/json/* so the full API surface
	# (schemas, request examples, route map) is not public. Defends in
	# depth: even a logged-in API user needs the separate nginx credential.
	# The credential lives in /etc/nginx/.htpasswd (host file, gitignored).
	location /docs {
		auth_basic           "Ninbus API Docs";
		auth_basic_user_file /etc/nginx/.htpasswd;
		set $backend_api "api:8081";
		proxy_pass http://$backend_api;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		set $backend_api "api:8081";
		proxy_pass http://$backend_api;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# SSE endpoints (/api/companies/:id/sse, /api/sse/global):
		# disable buffering so events stream immediately. Responses also send
		# `X-Accel-Buffering: no` (see src/modules/sse/index.ts).
		proxy_buffering    off;
		proxy_read_timeout 86400s;
		send_timeout       86400s;
	}
}

