# ═══════════════════════════════════════════════════════════════════════
# Ninbus — Reverse Proxy (main nginx config)
#
# Name-based virtual hosting over a single public IP. The 3 DNS records
# (api.ninbus.frt.com.br, ninbus.frt.com.br, hb.ninbus.frt.com.br) all
# resolve to the same host; nginx routes each request by the Host header
# (SNI on TLS). See conf.d/ninbus.conf for the vhosts.
#
# This file holds global directives only; vhosts live in conf.d/.
# Reusable after a config edit:  docker compose restart nginx
# ═══════════════════════════════════════════════════════════════════════

worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	sendfile          on;
	tcp_nopush        on;
	keepalive_timeout 65;

	# Logs visible in `docker compose logs nginx`
	access_log /dev/stdout;
	error_log  /dev/stderr warn;

	# Preserve the real client IP for the upstream apps. Elysia's rate limiter
	# already reads x-forwarded-for / x-real-ip, so the public client IP is
	# honored end-to-end instead of collapsing to the proxy IP.

	# ── DDI rate limiting: per-DEVICE, not per-IP ──────────────────────
	# The whole fleet polls from the SAME public IP (carrier/garage NAT),
	# so a per-IP zone throttles the fleet as ONE client: at the real ~5s
	# polling cadence, 5 devices ≈ 60 r/min > 30 r/m → mass 503s whenever
	# several devices power up together (2026-11-18 incident, excess 10.7
	# by zone "ddi"). The fine zone below keys on the controllerId taken
	# from the DDI URI: each device gets its OWN 30 r/min bucket (steady
	# 5s polling ≈ 12 r/min → 2.5× headroom; boot = poll + configData +
	# deploymentBase fits the burst). URIs without a controllerId (malformed)
	# fall back to the client IP. NEVER default to "" — requests with an
	# empty key are NOT accounted by limit_req (documented nginx behavior).
	map $uri $ddi_dev_key {
		~^/[^/]+/controller/v1/(?<ctrl>[^/]+)  $ctrl;
		default                                 $binary_remote_addr;
	}
	limit_req_zone $ddi_dev_key zone=ddi:10m rate=30r/m;

	# Coarse per-IP umbrella: keying the fine zone on the URI lets an
	# attacker rotate fake controllerIds for fresh buckets, so keep an
	# aggregate per-IP ceiling against floods. 1200 r/m ≈ 40 devices at
	# their individual 30 r/min legit max behind ONE NAT — revisit when
	# a single-NAT fleet grows past ~40 devices (same collapse, higher bar).
	limit_req_zone $binary_remote_addr zone=ddi_ip:10m rate=1200r/m;

	# Retry-After ONLY on rejected requests: an empty value makes nginx
	# omit the header, so proxied 200/401 responses stay untouched.
	map $limit_req_status $ddi_retry_after {
		default          "";
		rejected         "30";
		rejected_delayed "30";
	}

	include /etc/nginx/conf.d/*.conf;
}
