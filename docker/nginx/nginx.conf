# ═══════════════════════════════════════════════════════════════════════
# Ninbus — Reverse Proxy (main nginx config)
#
# Name-based virtual hosting over a single public IP. The 3 DNS records
# (api.ninbus.frt.com.br, ninbus.frt.com.br, hb.ninbus.frt.com.br) all
# resolve to the same host; nginx routes each request by the Host header
# (SNI on TLS). See conf.d/ninbus.conf for the vhosts.
#
# This file holds global directives only; vhosts live in conf.d/.
# Reusable after a config edit:  docker compose restart nginx
# ═══════════════════════════════════════════════════════════════════════

worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	sendfile          on;
	tcp_nopush        on;
	keepalive_timeout 65;

	# Logs visible in `docker compose logs nginx`
	access_log /dev/stdout;
	error_log  /dev/stderr warn;

	# Preserve the real client IP for the upstream apps. Elysia's rate limiter
	# already reads x-forwarded-for / x-real-ip, so the public client IP is
	# honored end-to-end instead of collapsing to the proxy IP.

	# Per-IP rate limit for the DDI path (devices poll every 5 min, so
	# 30 req/min/IP is generous and blocks brute-force of TargetTokens).
	limit_req_zone $binary_remote_addr zone=ddi:10m rate=30r/m;

	include /etc/nginx/conf.d/*.conf;
}
